<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqupon.id - Dashboard Aquaponik Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg-light: #f3f4f6;
            --bg-dark: #0f172a;
            --card-light: #ffffff;
            --card-dark: #1e293b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s, color 0.3s;
            background-color: var(--bg-light);
            color: #1e293b;
            -webkit-tap-highlight-color: transparent;
        }

        body.dark-mode {
            background-color: var(--bg-dark);
            color: #f8fafc;
        }

        /* Animated Mesh Gradient Background untuk Login */
        .mesh-bg {
            background: linear-gradient(-45deg, #0f172a, #064e3b, #0f172a, #022c22);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .dark-mode .glass-card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Bento Grid 3D Hover Effect */
        .bento-card {
            background-color: var(--card-light);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .dark-mode .bento-card {
            background-color: var(--card-dark);
            border-color: rgba(255,255,255,0.05);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .bento-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.1);
        }

        /* Floating Pill Navigation */
        .floating-nav {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 100px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 8px 16px;
            z-index: 50;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .dark-mode .floating-nav {
            background: rgba(30, 41, 59, 0.85);
            border-color: rgba(255,255,255,0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .nav-item {
            position: relative;
            color: #64748b;
            transition: all 0.3s;
        }

        .nav-item.active {
            color: var(--primary);
            background: rgba(16, 185, 129, 0.1);
            border-radius: 100px;
            padding: 8px 16px;
        }

        /* Custom Input Styling */
        .input-modern {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        
        .input-modern:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
            transform: translateY(-2px);
        }

        /* Toggle Switch Custom */
        .toggle-switch:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }
        
        .page-section { display: none; animation: slideUp 0.4s ease-out forwards; opacity: 0; }
        .page-section.active-section { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Chart Container */
        .chart-container { height: 60px; width: 100%; margin-top: 10px; }
    </style>
</head>
<body class="antialiased">

    <!-- Toast -->
    <div id="toast" class="fixed top-4 left-50 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 transition-opacity duration-300 z-[100] flex items-center gap-2 pointer-events-none"></div>

    <!-- Login Page -->
    <div id="login-page" class="min-h-screen flex items-center justify-center p-4 mesh-bg relative overflow-hidden">
        <div class="w-full max-w-md relative z-10">
            <div class="text-center mb-8">
                <div class="inline-flex justify-center items-center w-20 h-20 rounded-3xl bg-white/10 backdrop-blur-sm mb-4 shadow-[0_0_40px_rgba(16,185,129,0.3)]">
                    <i class="fas fa-leaf text-4xl text-emerald-400"></i>
                </div>
                <h1 class="text-4xl font-bold text-white tracking-tight">Aqupon.id</h1>
                <p class="text-emerald-200 mt-2 font-medium">Smart Aquaponics Hub</p>
            </div>

            <!-- Login Glass Card -->
            <div class="glass-card p-8 rounded-3xl">
                <form id="loginForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-emerald-100 mb-1 ml-1">Email</label>
                        <input type="email" required class="input-modern w-full px-5 py-3 rounded-xl text-gray-800 focus:outline-none" placeholder="nama@email.com">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-emerald-100 mb-1 ml-1">Kata Sandi</label>
                        <input type="password" required class="input-modern w-full px-5 py-3 rounded-xl text-gray-800 focus:outline-none" placeholder="••••••••">
                    </div>
                    
                    <button type="submit" class="w-full py-3.5 px-4 bg-emerald-500 hover:bg-emerald-400 text-white rounded-xl font-bold shadow-[0_4px_14px_0_rgba(16,185,129,0.39)] transition-all transform hover:-translate-y-1 mt-4">
                        Masuk ke Dashboard <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- App Container -->
    <div id="app-container" class="hidden min-h-screen pb-24">
        <!-- Header -->
        <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-100 dark:bg-emerald-900/50 flex items-center justify-center text-emerald-600 dark:text-emerald-400">
                    <i class="fas fa-leaf"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-none">LihatKebunku</h1>
                    <span class="text-xs text-gray-500 flex items-center gap-1 mt-1">
                        <span id="conn-dot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        Realtime
                    </span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-100 dark:bg-slate-800 text-gray-600 dark:text-yellow-400 hover:scale-110 transition-transform">
                    <i class="fas fa-moon" id="theme-icon"></i>
                </button>
                <button id="logout-btn" class="w-10 h-10 rounded-full flex items-center justify-center bg-red-50 dark:bg-red-900/20 text-red-500 hover:scale-110 transition-transform">
                    <i class="fas fa-power-off"></i>
                </button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 pt-6">
            <!-- Dashboard Section (Bento Grid) -->
            <section id="dashboard" class="page-section active-section">
                <!-- Header Stats -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                    <div class="bento-card p-5 bg-gradient-to-br from-emerald-500 to-teal-600 text-white border-0">
                        <p class="text-emerald-100 text-sm font-medium">Skor Kesehatan</p>
                        <h2 class="text-4xl font-bold mt-1">92%</h2>
                    </div>
                    <div class="bento-card p-5 flex flex-col justify-center items-center text-center">
                        <i class="fas fa-check-circle text-2xl text-emerald-500 mb-2"></i>
                        <p class="text-sm text-gray-500 dark:text-gray-400">Status Sistem</p>
                        <p class="font-bold text-gray-800 dark:text-gray-200">Optimal</p>
                    </div>
                </div>

                <h3 class="text-lg font-bold mb-4 dark:text-white">Sensor Realtime</h3>
                
                <!-- Bento Grid Layout -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <!-- pH Card -->
                    <div class="bento-card p-5 col-span-2 md:col-span-1">
                        <div class="flex justify-between items-start">
                            <div class="w-10 h-10 rounded-xl bg-purple-100 dark:bg-purple-900/30 flex items-center justify-center text-purple-500">
                                <i class="fas fa-vial"></i>
                            </div>
                            <span class="px-2 py-1 bg-emerald-100 text-emerald-700 text-xs rounded-lg font-bold">Normal</span>
                        </div>
                        <div class="mt-4">
                            <p class="text-sm text-gray-500 dark:text-gray-400">pH Air</p>
                            <h3 class="text-3xl font-bold dark:text-white">6.8</h3>
                        </div>
                        <div class="chart-container"><canvas id="phChart"></canvas></div>
                    </div>

                    <!-- TDS Card -->
                    <div class="bento-card p-5 col-span-2 md:col-span-1">
                        <div class="flex justify-between items-start">
                            <div class="w-10 h-10 rounded-xl bg-blue-100 dark:bg-blue-900/30 flex items-center justify-center text-blue-500">
                                <i class="fas fa-water"></i>
                            </div>
                            <span class="px-2 py-1 bg-emerald-100 text-emerald-700 text-xs rounded-lg font-bold">Normal</span>
                        </div>
                        <div class="mt-4">
                            <p class="text-sm text-gray-500 dark:text-gray-400">Nutrisi (TDS)</p>
                            <h3 class="text-3xl font-bold dark:text-white">520 <span class="text-sm font-normal text-gray-400">ppm</span></h3>
                        </div>
                        <div class="chart-container"><canvas id="tdsChart"></canvas></div>
                    </div>

                    <!-- Suhu & Kelembapan (Stacked in Bento) -->
                    <div class="grid grid-rows-2 gap-4 col-span-2 md:col-span-2">
                        <div class="bento-card p-5 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-xl bg-orange-100 dark:bg-orange-900/30 flex items-center justify-center text-orange-500 text-xl">
                                    <i class="fas fa-temperature-half"></i>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-500 dark:text-gray-400">Suhu Udara</p>
                                    <h3 class="text-2xl font-bold dark:text-white">30.2°C</h3>
                                </div>
                            </div>
                            <div class="w-24 h-12"><canvas id="airTempChart"></canvas></div>
                        </div>
                        <div class="bento-card p-5 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-xl bg-cyan-100 dark:bg-cyan-900/30 flex items-center justify-center text-cyan-500 text-xl">
                                    <i class="fas fa-cloud-rain"></i>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-500 dark:text-gray-400">Kelembapan</p>
                                    <h3 class="text-2xl font-bold dark:text-white">65%</h3>
                                </div>
                            </div>
                            <div class="w-24 h-12"><canvas id="humChart"></canvas></div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Section lain (Kontrol, Riwayat, dll) diringkas untuk struktur -->
            <!-- ... (Gunakan struktur class 'bento-card' yang sama) ... -->
        </main>

        <!-- Floating Pill Navbar -->
        <nav class="floating-nav flex justify-between items-center">
            <a href="#" class="nav-item active flex items-center gap-2" onclick="switchTab(this, 'dashboard')">
                <i class="fas fa-border-all text-lg"></i>
                <span class="text-sm font-semibold hidden md:block">Dashboard</span>
            </a>
            <a href="#" class="nav-item flex items-center gap-2 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-slate-700" onclick="switchTab(this, 'kontrol')">
                <i class="fas fa-sliders-h text-lg"></i>
            </a>
            <a href="#" class="nav-item flex items-center gap-2 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-slate-700" onclick="switchTab(this, 'riwayat')">
                <i class="fas fa-history text-lg"></i>
            </a>
            <a href="#" class="nav-item flex items-center gap-2 p-2 rounded-full hover:bg-gray-100 dark:hover:bg-slate-700" onclick="switchTab(this, 'pengaturan')">
                <i class="fas fa-cog text-lg"></i>
            </a>
        </nav>
    </div>

    <script>
        // Logika Javascript kamu tetap sama, hanya sesuaikan sedikit pemanggilan UI
        const loginPage = document.getElementById('login-page');
        const appContainer = document.getElementById('app-container');

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            loginPage.style.display = 'none';
            appContainer.classList.remove('hidden');
            showToast('Berhasil masuk!');
            // Panggil fungsi inisialisasi Chart & Firebase kamu di sini
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            appContainer.classList.add('hidden');
            loginPage.style.display = 'flex';
        });

        function switchTab(element, sectionId) {
            // Hapus class active dari semua menu
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
                el.classList.remove('px-4'); // Hapus padding horizontal
                // Sembunyikan teks label di tampilan mobile
                const text = el.querySelector('span');
                if(text) text.classList.add('hidden');
            });

            // Tambahkan class active ke elemen yang diklik
            element.classList.add('active', 'px-4');
            const text = element.querySelector('span');
            if(!text) {
                // Buat span teks jika belum ada
                const label = sectionId.charAt(0).toUpperCase() + sectionId.slice(1);
                element.innerHTML += `<span class="text-sm font-semibold ml-2">${label}</span>`;
            } else {
                text.classList.remove('hidden');
            }
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const icon = document.getElementById('theme-icon');
            if(document.body.classList.contains('dark-mode')){
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            } else {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<i class="fas fa-check-circle text-emerald-400"></i> ${msg}`;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 20px)';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 0)';
            }, 3000);
        }
    </script>
</body>
</html>
